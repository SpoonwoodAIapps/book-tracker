<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Book Tracker</title>
<meta name="description" content="Your reading list in priority order, a reading timer, and how much you read each day, week and month. Your data stays on this device.">
<meta name="theme-color" content="#F4F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17111D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Books">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&display=swap">
<style>
/* Book Tracker: plum ink on lavender-grey paper, with one highlighter. Literata for books and the numbers that matter,
   the phone's own font for everything else. */
:root {
  --paper: #F4F3F7; --surface: #FFFFFF; --sunk: #ECE9F1; --ink: #2A1F36; --ink-2: #4A4055; --muted: #6E6579; --line: #E3DFEA; --line-2: #D0C8DA;
  --plum: #3E2152; --plum-edge: #3E2152; --plum-soft: #ECE5F3; --plum-text: #5A3477; --on-plum: #F7F2FB; --on-plum-2: #CDBFDB; --plum-line: rgba(255, 255, 255, 0.24);
  --hl: #FFE15A; --hl-ink: #2A1F36;
  --good: #1F8A5B; --good-soft: #E2F2E9; --bad: #C2413A; --bad-soft: #FBE6E4;
  --scrim: rgba(30, 18, 40, 0.45);
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tab-h: 62px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #17111D; --surface: #211A29; --sunk: #2A2233; --ink: #F1ECF6; --ink-2: #D5CCDE; --muted: #A79DB3; --line: #352B40; --line-2: #4A3F57;
    --plum: #3A2150; --plum-edge: #4A2A66; --plum-soft: #33244A; --plum-text: #D2B9EA; --on-plum: #F7F2FB; --on-plum-2: #CBBBDB;
    --hl: #F2D54E;
    --good: #46C08A; --good-soft: #163327; --bad: #F07A72; --bad-soft: #3D1E22;
    --scrim: rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.45 var(--ui); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--plum-text); outline-offset: 2px; }
.hero :focus-visible { outline-color: var(--hl); }
.serif { font-family: var(--serif); }
.muted { color: var(--muted); }
.small { font-size: 14px; margin: 0; }
.spacer { flex: 1; }
.good-t { color: var(--good); font-weight: 650; }

/* ---------- Frame ---------- */
.app { max-width: 620px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
.topbar { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 0 6px; }
.wordmark { margin: 0; display: flex; align-items: center; gap: 9px; font: 600 20px/1 var(--serif); letter-spacing: -0.005em; }
.mark { width: 13px; height: 19px; background: var(--plum); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%); position: relative; }
.mark::after { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 4px; background: var(--hl); }
@media (prefers-color-scheme: dark) { .mark { background: var(--plum-text); } }
.view { padding: 6px 0 calc(var(--tab-h) + 36px + env(safe-area-inset-bottom)); display: grid; gap: 16px; align-content: start; }
.loading { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 80px 16px; color: var(--muted); }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--plum-text); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Tab bar: the current tab is highlighted like a word on a page ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(3, 1fr); max-width: 620px; margin: 0 auto;
  padding: 6px max(8px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  background: color-mix(in srgb, var(--surface) 94%, transparent); border-top: 1px solid var(--line); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
@media (min-width: 640px) { .tabbar { border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; } }
.tab { display: grid; justify-items: center; gap: 3px; min-height: 50px; padding: 5px 0 3px; border: 0; background: none; color: var(--muted); font-size: 12.5px; font-weight: 600; border-radius: 10px; }
.tab span { padding: 0 3px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] span { background: linear-gradient(transparent 42%, var(--hl) 42%, var(--hl) 92%, transparent 92%); border-radius: 2px 5px 3px 6px; }
@media (prefers-color-scheme: dark) { .tab[aria-current="page"] span { background: var(--hl); color: var(--hl-ink); padding: 0 5px; } }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; font-weight: 650; font-size: 16px; white-space: nowrap; text-decoration: none; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 14.5px; border-radius: 10px; gap: 6px; }
.btn.sm .i { width: 18px; height: 18px; }
.btn.block { width: 100%; }
.btn.hl { background: var(--hl); color: var(--hl-ink); }
.btn.plum { background: var(--plum); color: var(--on-plum); }
@media (prefers-color-scheme: dark) { .btn.plum { background: #6B3E92; } }
.btn.ghost { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
.btn.on-plum { background: transparent; border-color: var(--plum-line); color: var(--on-plum); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.danger-t { color: var(--bad); }
.btn:active:not(:disabled) { filter: brightness(0.94); }
.btn:disabled { opacity: 0.45; }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border: 0; border-radius: 12px; background: none; color: var(--ink); padding: 0; flex: none; }
.icon-btn:active { background: var(--sunk); }
.icon-btn.on-plum { color: var(--on-plum); }
.icon-btn.on-plum:active { background: rgba(255, 255, 255, 0.1); }
.link { border: 0; background: none; padding: 6px 0; color: var(--plum-text); font-weight: 650; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 3px; text-align: left; }
.link.on-plum { color: var(--on-plum-2); font-weight: 600; font-size: 14.5px; justify-self: start; }

/* ---------- The highlighter ---------- */
.hl-bar { position: relative; height: 15px; }
.hl-bar::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; border-radius: 2px; background: var(--line-2); }
.hl-bar > i { position: absolute; left: 0; top: 1px; bottom: 1px; min-width: 7px; max-width: 100%; background: var(--hl); border-radius: 3px 9px 4px 11px / 7px 4px 9px 5px; transform-origin: left center; }
@media (prefers-color-scheme: light) { .hl-bar > i { mix-blend-mode: multiply; } }
.hl-bar.zero > i { display: none; }
.hl-bar.swipe > i { animation: swipe 0.75s cubic-bezier(0.3, 0.7, 0.2, 1) 0.15s both; }
@keyframes swipe { from { transform: scaleX(0); } }

/* ---------- Reading now ---------- */
.hero { background: var(--plum); color: var(--on-plum); border: 1px solid var(--plum-edge); border-radius: 22px; padding: 14px 18px 18px; display: grid; gap: 10px; }
.hero.empty { padding: 22px 20px 20px; gap: 12px; }
.hero-top { display: flex; align-items: center; gap: 6px; margin: 0 -8px -4px 0; min-height: 44px; }
.hero-area { display: inline-flex; align-items: center; gap: 9px; border: 0; background: none; padding: 6px 0; color: var(--on-plum-2); font-size: 15px; font-weight: 600; text-align: left; min-width: 0; }
.hero-area .num { width: 24px; height: 24px; flex: none; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, 0.13); color: var(--on-plum); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hero-book { display: grid; gap: 2px; }
.hero-title { margin: 0; font: 600 28px/1.14 var(--serif); letter-spacing: -0.01em; text-wrap: balance; }
.hero-title button { border: 0; background: none; padding: 0; margin: 0; font: inherit; color: inherit; text-align: left; letter-spacing: inherit; }
.hero-author { margin: 0; font: italic 400 17px/1.3 var(--serif); color: var(--on-plum-2); }
.hero .hl-bar { margin-top: 6px; }
.hero .hl-bar::before { background: var(--plum-line); }
.hero .hl-bar > i { mix-blend-mode: normal; }
.hero-pages { margin: -4px 0 0; display: flex; justify-content: space-between; gap: 12px; color: var(--on-plum-2); font-size: 14.5px; font-variant-numeric: tabular-nums; }
.hero-note { margin: 2px 0 0; color: var(--on-plum-2); font-size: 15.5px; }
.hero-actions { display: flex; gap: 10px; margin-top: 4px; }
.hero-actions .btn { flex: 1 1 0; }
.timer { display: grid; gap: 2px; margin-top: 6px; }
.clock { font: 500 56px/1 var(--serif); font-variant-numeric: tabular-nums lining-nums; letter-spacing: -0.02em; }
.timer.paused .clock { color: var(--on-plum-2); }
.timer-note { color: var(--on-plum-2); font-size: 14.5px; }

/* ---------- This week and this month ---------- */
.goals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.gcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px 12px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.g-label { margin: 0 0 2px; font-size: 14px; font-weight: 600; color: var(--muted); }
.g-big { margin: 0; font: 600 26px/1.1 var(--serif); font-variant-numeric: tabular-nums lining-nums; }
.g-of { margin: 0 0 4px; font-size: 13.5px; color: var(--muted); }
.g-of small { display: block; font-size: 12.5px; }
.g-pages { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }
.g-status { margin: 0; font-size: 14px; color: var(--muted); }
.g-status .i { width: 16px; height: 16px; vertical-align: -3px; margin-right: 3px; stroke-width: 2.4; }
.g-status .link { padding: 2px 0; font-size: 14px; }
.gcard.hit { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.past { display: flex; flex-wrap: wrap; gap: 8px; margin-top: -6px; }
.past-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 6px 12px 6px 10px; border-radius: 999px; border: 1px solid transparent; font-size: 14px; text-align: left; }
.past-chip .i { width: 17px; height: 17px; stroke-width: 2.5; }
.past-chip strong { font-weight: 650; }
.past-chip.hit { background: var(--good-soft); color: var(--good); }
.past-chip.miss { background: var(--bad-soft); color: var(--bad); }

/* ---------- Lists ---------- */
.sect { display: grid; gap: 8px; }
.h1 { margin: 0; font: 600 26px/1.15 var(--serif); }
.h2 { margin: 0; font: 600 20px/1.2 var(--serif); }
.h3 { margin: 10px 0 -4px; font: 600 18px/1.2 var(--serif); }
.h3.first { margin-top: 0; }
.lines { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.lines li + li { border-top: 1px solid var(--line); }
.bline { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 10px 14px; border: 0; background: none; text-align: left; }
.bline:active { background: var(--sunk); }
.bl-main { flex: 1; min-width: 0; display: grid; gap: 1px; }
.bl-main strong { font: 600 17px/1.25 var(--serif); }
.bl-main span { color: var(--muted); font-size: 14px; }
.bl-area { flex: none; max-width: 40%; font-size: 13px; font-weight: 600; color: var(--plum-text); background: var(--plum-soft); padding: 3px 9px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.start-list { display: grid; gap: 12px; justify-items: start; padding: 10px 2px; }
.start-list p { margin: 0; color: var(--ink-2); max-width: 46ch; }
.hint { margin: 0; color: var(--muted); font-size: 14px; }

/* ---------- Books: areas in priority order, books in reading order ---------- */
.areas { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.area { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.area-head { display: flex; align-items: center; gap: 4px; min-height: 62px; padding-right: 12px; }
.area-n { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--plum-soft); color: var(--plum-text); font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; margin-right: 8px; }
.area.done .area-n { background: var(--plum); color: var(--on-plum); }
@media (prefers-color-scheme: dark) { .area.done .area-n { background: #6B3E92; } }
.area-n .i { width: 17px; height: 17px; stroke-width: 2.6; }
.area-name { flex: 1; min-width: 0; display: grid; gap: 1px; border: 0; background: none; padding: 10px 0; text-align: left; }
.area-name strong { font: 600 20px/1.2 var(--serif); }
.area-name span { color: var(--muted); font-size: 14px; }
.blist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.brow { display: flex; align-items: center; gap: 2px; min-height: 60px; padding-right: 12px; background: var(--surface); }
.brow + .brow, .b-ph + .brow, .brow + .b-ph { border-top: 1px solid var(--line); }
.blist > .brow.lifted:first-child + .brow { border-top: 0; }
.grip { align-self: stretch; width: 42px; flex: none; display: grid; place-items: center; padding: 0; border: 0; background: none; color: var(--muted); touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.grip .i { width: 21px; height: 21px; }
.rdot { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border: 0; background: none; padding: 0; margin-right: 4px; color: transparent; }
.rdot .i { width: 26px; height: 26px; padding: 4px; border-radius: 50%; border: 2px solid var(--line-2); stroke-width: 2.8; box-sizing: border-box; }
.rdot[aria-checked="true"] { color: var(--on-plum); }
.rdot[aria-checked="true"] .i { background: var(--plum); border-color: var(--plum); }
@media (prefers-color-scheme: dark) { .rdot[aria-checked="true"] .i { background: #6B3E92; border-color: #6B3E92; } }
.b-main { flex: 1; min-width: 0; display: grid; gap: 1px; border: 0; background: none; padding: 10px 0; text-align: left; }
.b-main strong { font: 600 16.5px/1.25 var(--serif); }
.b-main span { color: var(--muted); font-size: 14px; }
.brow.is-read .b-main strong { color: var(--ink-2); font-weight: 500; }
.b-side { flex: none; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag { flex: none; font-size: 12.5px; font-weight: 650; padding: 2px 8px; border-radius: 3px 8px 4px 9px / 6px 3px 7px 4px; }
.tag.now { background: var(--hl); color: var(--hl-ink); }
.b-empty { display: none; padding: 16px 16px 16px 54px; color: var(--muted); font-size: 14.5px; }
.blist.is-empty .b-empty { display: block; }
.add-book { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 50px; padding: 0 16px 0 52px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--plum-text); font-weight: 650; font-size: 15px; text-align: left; }
.add-book .i { width: 18px; height: 18px; }
.add-book:active { background: var(--sunk); }
.b-ph { border: 2px dashed var(--line-2); border-radius: 12px; margin: 4px 8px; }
.area-ph { border: 2px dashed var(--line-2); border-radius: 18px; }
.brow.lifted { position: fixed; z-index: 35; margin: 0; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 32px rgba(30, 18, 40, 0.22); transform: scale(1.02); }
.area.lifted { position: fixed; z-index: 35; margin: 0; box-shadow: 0 14px 32px rgba(30, 18, 40, 0.24); transform: scale(1.02); }
.lifted .grip { cursor: grabbing; }
html.dragging-areas .blist, html.dragging-areas .add-book { display: none; }
html.dragging, html.dragging * { -webkit-user-select: none; user-select: none; cursor: grabbing; }

/* ---------- Calendar ---------- */
.cal-nav { display: flex; align-items: center; gap: 2px; margin: 0 0 -4px -10px; }
.cal-title { margin: 0 4px; font: 600 22px/1.2 var(--serif); min-width: 0; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 6px; }
.pc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pc-time { margin: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.pc-time strong { font: 600 28px/1.1 var(--serif); font-variant-numeric: tabular-nums lining-nums; }
.pc-time span { color: var(--muted); font-size: 14.5px; }
.pc-foot { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.pcard .link { padding: 2px 0; font-size: 14.5px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 14px; font-weight: 650; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
.pill .i { width: 16px; height: 16px; stroke-width: 2.5; }
.pill.hit { background: var(--good-soft); color: var(--good); }
.pill.miss { background: var(--bad-soft); color: var(--bad); }
.pcard.hit { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.pcard.miss { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.calcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 10px 12px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)) minmax(0, 1.3fr); gap: 4px; }
.dow { font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; padding-bottom: 2px; }
.dow.wk-h { text-align: center; }
.day, .wk { min-width: 0; aspect-ratio: 1 / 1.08; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 4px 4px 5px; border: 1px solid transparent; border-radius: 8px; background: none; text-align: left; font-variant-numeric: tabular-nums; }
.dn { font-size: 12px; font-weight: 600; color: var(--ink-2); line-height: 1; }
.dv { font-size: 11.5px; font-weight: 650; line-height: 1; white-space: nowrap; color: var(--muted); max-width: 100%; overflow: hidden; }
.day.read { background: var(--hl); border-radius: 4px 9px 5px 10px / 8px 4px 9px 5px; }
.day.read .dn, .day.read .dv { color: var(--hl-ink); }
.day.out { opacity: 0.42; }
.day.future .dn { color: var(--muted); }
.day.today { border-color: var(--ink); }
.day.read.today { box-shadow: inset 0 0 0 1px var(--ink); border-color: transparent; }
.wk { background: var(--sunk); align-items: center; justify-content: center; gap: 3px; }
.wv { font-size: 12.5px; font-weight: 700; line-height: 1; white-space: nowrap; }
.wp { font-size: 11px; color: var(--muted); line-height: 1; white-space: nowrap; }
.wk.hit { background: var(--good-soft); color: var(--good); }
.wk.miss { background: var(--bad-soft); color: var(--bad); }
.wk.hit .wp, .wk.miss .wp { color: inherit; opacity: 0.85; }
.wk:disabled { background: none; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 10px 2px 0; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.sw.hit { background: var(--good-soft); box-shadow: inset 0 0 0 1.5px var(--good); }
.sw.miss { background: var(--bad-soft); box-shadow: inset 0 0 0 1.5px var(--bad); }

/* ---------- Sheets ---------- */
html.sheet-open, html.sheet-open body { overflow: hidden; }
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: var(--scrim); animation: fade 0.18s ease-out; }

/* Storage on this device: IndexedDB, falling back to localStorage, then memory.

  "use strict";

    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains("kv")) req.result.createObjectStore("kv", { keyPath: "k" }); };

  }

  }
  const quota = (e) => { const err = new Error("save failed"); err.code = e && (e.name === "QuotaExceededError" || e.code === 22) ? "quota" : "other"; return err; };

    const done = () => { if (chan) try { chan.postMessage("changed"); } catch (e) { /* closed */ } };
    if (mode === "idb") {

        let tx;

      return Promise.resolve();
    } catch (e) { return Promise.reject(quota(e)); }
  }

  async function saveFile(name, text, type) {
    const blob = new Blob([text], { type });
    const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (mobile && typeof File === "function" && navigator.canShare) {
      const file = new File([blob], name, { type });

        try { await navigator.share({ files: [file], title: name }); return "shared"; }
        catch (e) { if (e && e.name === "AbortError") return "cancelled"; }
      }

    document.body.appendChild(a); a.click(); a.remove();

function setBookOrder(lists, movedId) {

  const books = E.applyBookOrder(S.st, lists);

  const prev = clone(S.st), from = (bookById(movedId) || {}).areaId;

// The arrow keys move a book or an area one place (a book goes into the next area at its edge)

  const li = lists.findIndex((l) => l.areaId === b.areaId), i = lists[li].ids.indexOf(id);

// ---------- Calendar ----------
const DOW2 = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];
function viewCalendar() {
  const st = S.st, mk = S.calMonth || E.monthKey(S.today), ms = E.monthStart(mk), me = E.monthEnd(mk);
  const since = E.sinceDay(st), days = E.dayTotals(st.sessions);
  const mt = E.periodTotals(st.sessions, ms, me), mg = E.periodGoal(st, "month", ms, me), mstat = E.goalStatus(mt.secs, mg, me, S.today);
  const finished = st.books.filter((b) => b.done && b.doneOn && b.doneOn >= ms && b.doneOn <= me).length;
  let grid = DOW2.map((x) => `<span class="dow" aria-hidden="true">${x}</span>`).join("") + `<span class="dow wk-h" aria-hidden="true">Week</span>`;
  let weekGoals = false;
  for (const ws of E.monthWeeks(mk)) {
    for (const d of E.eachDay(ws, E.addDays(ws, 6))) grid += dayCell(d, days.get(d), ms, me, since);
    const we = E.addDays(ws, 6), t = E.periodTotals(st.sessions, ws, we), g = E.periodGoal(st, "week", ws, we), stt = E.goalStatus(t.secs, g, we, S.today);
    if (g) weekGoals = true;
    const future = ws > S.today, res = stt === "hit" ? ", goal hit" : stt === "miss" ? ", goal missed" : "";
    grid += `<button class="wk ${stt}" data-act="week" data-start="${ws}"${future ? " disabled" : ""} aria-label="Week of ${esc(E.fmtRange(ws, we))}: ${esc(E.fmtMins(t.secs))}${g ? ` of ${esc(E.fmtMins(g.min * 60))}` : ""}, ${plural(t.pages, "page")}${res}"><span class="wv">${future ? "" : E.fmtShort(t.secs)}</span><span class="wp">${future ? "" : `${t.pages} pg`}</span></button>`;
  }
  const nav = `<div class="cal-nav"><button class="icon-btn" data-act="cal" data-d="-1" aria-label="Previous month">${ICON.left}</button><h1 class="cal-title">${esc(E.fmtMonth(mk))}</h1><button class="icon-btn" data-act="cal" data-d="1" aria-label="Next month">${ICON.right}</button><span class="spacer"></span>${mk === E.monthKey(S.today) ? "" : `<button class="btn ghost sm" data-act="cal-now">This month</button>`}</div>`;

}
function dayCell(d, t, ms, me, since) {

  const label = `${E.fmtDay(d)}: ${read ? `${E.fmtMins(t.secs)}, ${plural(t.pages, "page")}` : future ? "coming up" : before ? "before you started" : "no reading"}`;

// A week or month: time against the goal, green once it's hit and red if it ends short

  const status = stt === "hit" ? `<span class="pill hit">${ICON.check}Goal hit</span>` : stt === "miss" ? `<span class="pill miss">${ICON.x}Missed by ${E.fmtMins(left)}</span>` : stt === "open" ? `<span class="pill">${E.fmtMins(left)} to go</span>` : `<button class="link" ${goalAttr}>Set a ${kind}ly goal</button>`;
  return `<div class="pcard ${stt}"><div class="pc-top"><p class="pc-time"><strong>${E.fmtMins(t.secs)}</strong>${g ? `<span>of ${E.fmtMins(g.min * 60)}${g.from ? `, from ${E.fmtMD(g.from)}` : ""}</span>` : ""}</p>${status}</div>${g ? hlBar((t.secs / (g.min * 60)) * 100) : ""}<p class="pc-foot">${plural(t.pages, "page")} read${extra || ""}</p></div>`;

function openDay(date) {

// ---------- Logging reading ----------

    <label class="btn ghost block file">${ICON.upload}Restore from a backup<input type="file" id="st-restore" accept="application/json,.json"></label>
    <div id="st-box" aria-live="polite"></div>
    <p class="muted small" id="st-last">${esc(lastLine())}</p>`;
  const B = sh.body;
  const setGoals = () => {
    const w = hoursIn($("#st-week", B).value), m = hoursIn($("#st-month", B).value), e = $("#st-err", B);
    if (Number.isNaN(w) || Number.isNaN(m)) { e.textContent = "Type hours as a number, like 4 or 3.5."; e.hidden = false; return; }
    e.hidden = true;
    const now = E.goalAt(S.st.goalLog, S.today);
    if ((now.weekMin || null) === (w || null) && (now.monthMin || null) === (m || null)) return;
    S.st.goalLog = E.setGoal(S.st.goalLog, S.today, w, m);
    commit();
  };
  $("#st-week", B).onchange = setGoals;
  $("#st-month", B).onchange = setGoals;
  $("#st-backup", B).onclick = async () => {
    const data = { app: "book-tracker", version: 1, exported_at: nowISO(), state: S.st };
    const r = await DB.saveFile(`book-tracker-backup-${S.today}.json`, JSON.stringify(data, null, 1), "application/json");
    if (r === "cancelled") return;
    setMeta({ lastBackup: nowISO() });
    $("#st-last", B).textContent = lastLine();
    toast("Backup saved");
  };
  const box = $("#st-box", B);
  $("#st-restore", B).onchange = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    let d = null;
    try { d = JSON.parse(await f.text()); } catch (err) { d = null; }
    if (!d || d.app !== "book-tracker" || !d.state || typeof d.state !== "object") { box.innerHTML = `<p class="form-err">That file isn't a Book Tracker backup.</p>`; return; }
    const ns = E.normState(d.state, S.today), dates = ns.sessions.map((x) => x.date).sort();
    box.innerHTML = `<div class="restore"><p>This backup has ${plural(ns.areas.length, "area")}, ${plural(ns.books.length, "book")} and ${plural(ns.sessions.length, "reading")}${dates.length ? ` from ${esc(withYear(dates[0]))} to ${esc(withYear(dates[dates.length - 1]))}` : ""}. Restoring replaces everything on this phone with it.</p><div class="row-btns"><button class="btn ghost sm" data-x="no">Cancel</button><button class="btn plum sm" data-x="yes">Restore</button></div></div>`;
    $("[data-x=no]", box).onclick = () => { box.innerHTML = ""; };
    $("[data-x=yes]", box).onclick = async () => {
      const t = S.st.timer;
      ns.timer = t && ns.books.some((b) => b.id === t.bookId) ? t : null;
      S.st = ns;
      try { await DB.save(S.st); } catch (err) { saveErr(err); return; }
      sh.close(true); render();
      toast("Restored your backup");
    };
  };
}

// ---------- Sheets ----------
const sheets = [];
function openSheet(o) {
  const wrap = document.createElement("div");
  wrap.className = "sheet-wrap";
  wrap.innerHTML = `<div class="sheet-backdrop" data-close></div><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(o.title)}"><header class="sheet-head"><h2>${esc(o.title)}</h2><button class="icon-btn" data-close aria-label="Close">${ICON.x}</button></header><div class="sheet-body"></div><footer class="sheet-foot" hidden></footer></section>`;
  document.body.appendChild(wrap);
  document.documentElement.classList.add("sheet-open");
  const prevFocus = document.activeElement;
  const api = {
    wrap, body: $(".sheet-body", wrap), foot: $(".sheet-foot", wrap), refresh: null,
    close(skipHook) {
      if (!document.contains(wrap)) return;
      wrap.remove();
      const i = sheets.indexOf(api); if (i >= 0) sheets.splice(i, 1);
      if (!sheets.length) { document.documentElement.classList.remove("sheet-open"); if (S.dirty) { S.dirty = false; render(); } }
      if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus({ preventScroll: true });
      if (!skipHook && o.onClose) o.onClose();
    },
    setTitle(t) { $(".sheet-head h2", wrap).textContent = t; $(".sheet", wrap).setAttribute("aria-label", t); },
    setFoot(html) { api.foot.hidden = !html; api.foot.innerHTML = html || ""; }
  };
  $$("[data-close]", wrap).forEach((b) => { b.onclick = () => api.close(); });
  sheets.push(api);
  setTimeout(() => { if (!o.focus) { const f = $(".sheet-head .icon-btn", wrap); if (f) f.focus({ preventScroll: true }); } }, 0);
  return api;
}
function refreshSheets() { for (const s of sheets.slice()) if (s.refresh) s.refresh(); }
function closeAllSheets() { while (sheets.length) sheets[sheets.length - 1].close(true); }
function confirmBox(o) {
  return new Promise((resolve) => {
    let answered = false;
    const sh = openSheet({ title: o.title, onClose: () => { if (!answered) resolve(false); } });
    sh.body.innerHTML = `<p class="lead">${esc(o.body)}</p>`;
    sh.setFoot(`<button class="btn ghost" data-x="no">Cancel</button><button class="btn ${o.danger ? "danger" : "plum"}" data-x="yes">${esc(o.ok)}</button>`);
    $("[data-x=no]", sh.foot).onclick = () => sh.close();
    $("[data-x=yes]", sh.foot).onclick = () => { answered = true; sh.close(true); resolve(true); };
  });
}
function choiceSheet(title, options, cb) {
  const sh = openSheet({ title });
  sh.body.innerHTML = `<div class="choices">${options.map(([k, label, sub]) => `<button class="choice" data-k="${esc(k)}"><span class="choice-main"><strong>${esc(label)}</strong>${sub ? `<span>${esc(sub)}</span>` : ""}</span>${ICON.right}</button>`).join("")}</div>`;
  $$("[data-k]", sh.body).forEach((b) => { b.onclick = () => { sh.close(true); cb(b.dataset.k); }; });
  return sh;
}
function field(label, inner, hint) { return `<label class="field"><span class="field-l">${esc(label)}</span>${inner}${hint ? `<span class="field-h">${esc(hint)}</span>` : ""}</label>`; }

// ---------- Toast ----------
let toastTimer = null;
function toast(msg, action) {
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ""}`;
  t.hidden = false;
  if (action) $("button", t).onclick = () => { t.hidden = true; action.run(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, action ? 8000 : 3500);
}

// ---------- Start ----------
async function boot() {
  render();
  await DB.init();
  let raw = null;
  try { raw = await DB.load(); } catch (e) { raw = null; }
  S.st = E.normState(raw, S.today);
  if (!raw) await DB.save(S.st).catch(() => {});
  S.booted = true;
  render();
  DB.onChange(async () => {
    let r = null;
    try { r = await DB.load(); } catch (e) { return; }
    if (!r) return;
    S.st = E.normState(r, S.today);
    if (sheets.length || drag) S.dirty = true; else render();
  });
  if (DB.mode() === "memory") setTimeout(() => toast("This browser won't keep your books (Private Browsing?). Open the app normally to save them."), 800);
}
window.addEventListener("pageshow", (e) => { if (e.persisted && S.booted) render(); });
boot();

})();

</script>

if ("serviceWorker" in navigator) window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
</script>
